services:
  homenet-hub:
    build: .
    container_name: homenet-hub
    restart: unless-stopped
    init: true
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - PG_DSN=${PG_DSN:-}                # read-only token DB (optional; demo needs none)
      # B26: credential vault. Unset -> the vault stays locked and the panel runs exactly
      # as before, minus the credentials panel. Generate with: openssl rand -base64 32
      - VAULT_KEY=${VAULT_KEY:-}
      # admin auth. Unset -> every management endpoint answers 401 (fail-closed) and the
      # UI hides its admin controls; the dashboard itself is unaffected.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Optional: also require a login to VIEW the board (default off).
      - REQUIRE_LOGIN_TO_VIEW=${REQUIRE_LOGIN_TO_VIEW:-}
      - PUSH_TOKEN_GPU1=${PUSH_TOKEN_GPU1:-} # http_push shared secret (optional)
      - PUSH_TOKEN_M26=${PUSH_TOKEN_M26:-}   # machine 26 push agent
      - PUSH_TOKEN_M25=${PUSH_TOKEN_M25:-}   # machine 25 push agent
      - PUSH_TOKEN_M110=${PUSH_TOKEN_M110:-}  # machine 110 push agent
      - PUSH_TOKEN_M24=${PUSH_TOKEN_M24:-}   # machine 24 self-monitor agent
      - PUSH_TOKEN_M27=${PUSH_TOKEN_M27:-}   # machine 27 push agent
      - PUSH_TOKEN_NAS75=${PUSH_TOKEN_NAS75:-}  # NAS 75 push agent
    volumes:
      - ./config:/app/config:ro          # YAML config, read-only mount (edit on host → chokidar hot-reload)
      - ./data:/app/data                 # SQLite timeseries volume (persisted)
      # The version string, and ONLY that. server/version.js reads `.version` out of
      # /app/package.json at startup and takes nothing else from it; deps were resolved
      # by `npm install` at BUILD time and live in the image's node_modules, so mounting
      # the host file changes no dependency, script or install behaviour.
      #
      # Why: without this the version is baked into the image, so a release that only
      # touches config/ or agents/ — which needs no rebuild — leaves the footer showing
      # the previous version. That drifted twice (v2.11, v2.13) before this mount.
      #
      # Two things this file DOES still decide at runtime: `"type": "module"` (Node reads
      # the nearest package.json to pick the module goal) and the `imports`/`exports`
      # fields. Keep them intact — a host package.json that loses `"type": "module"` will
      # stop the container from booting, where the baked copy could not be broken from
      # outside. version.js itself is already defensive: unreadable file or a version that
      # is not a plain semver-ish string → the version simply goes unreported.
      #
      # A single-file bind mount binds an INODE. An in-place rewrite (what an editor or a
      # version bump does) is seen immediately; a replace-and-rename (git checkout) is not
      # picked up until the container is recreated. Either way VERSION is read once at
      # import, so the footer only moves after the process restarts.
      - ./package.json:/app/package.json:ro
    extra_hosts: []                      # LAN direct, nothing special
    networks:
      - default
      - litellm

networks:
  litellm:
    external: true
    name: litellm_default
