# targets.yaml — data sources (§4.2)  ·  NEUTRAL DEMO
# Each target declares HOW to collect (source) and HOW to map raw JSON into
# metric keys (map). Adding a machine = add a block here + a card in layout.yaml.
#
# This file ships in DEMO MODE: every active target uses `type: demo`, which
# synthesizes plausible, slowly-moving values from the `map` below — so a fresh
# clone with NO real backend and NO env still shows a live, animated panel.
#
# To go live: replace a target's `source` with a real collector (http/http_push/
# sql/exec/tcp/tls) pointing at your own machine — the `map` stays the same. See
# the disabled "real-backend examples" near the bottom.
#
# B24: `interval` and `timeout` are duration strings — "500ms", "1.5s", "30s",
# "2m", "1h", "1d". Units below a second need the ms suffix; a bare number is read
# as seconds. h/d were added alongside the tls source, whose certificate moves once
# a day at most and has no business being polled on a seconds-scale clock.

defaults:
  http_proxy: ""
  timeout: "3s"

targets:
  # ── Gateway / this host ──
  - id: gateway
    name: "Gateway"
    color: auto            # B14 demo: role auto-detected → host (blue), no GPU metrics
    enabled: true
    source: { type: demo, interval: "1.5s" }
    map:
      cpu:        "$.cpu"
      mem_pct:    "$.mem.pct"
      disk_pct:   "$.disk.pct"
      mem_bytes:  { v: "$.mem.used_g", max: "$.mem.total_g" }
      disk_bytes: { v: "$.disk.used_g", max: "$.disk.total_g" }
      loadavg:    { m1: "$.load[0]", m5: "$.load[1]", m15: "$.load[2]" }
      net:        { rx: "$.net.rx", tx: "$.net.tx" }
      uptime:     { s: "$.uptime_s" }   # protocol field: seconds → {d}d {h}h in normalize

  # ── GPU node 1 ──
  - id: gpu1
    name: "GPU Node 1"
    color: auto            # B14 demo: role auto-detected → gpu (orange), was cyan
    badge: "GPU Node"
    source: { type: demo, interval: "1.5s" }
    map:
      uptime:     { s: "$.uptime_s" }   # B13 demo: header_right [badge, uptime]
      gpu:        "$.gpu"
      vram_pct:   "$.vram.pct"
      cpu:        "$.cpu"
      vram_bytes: { v: "$.vram.used_g", max: "$.vram.total_g" }
      mem_bytes:  { v: "$.mem.used_g",  max: "$.mem.total_g" }
      gpu_temp:   "$.gpu_temp"
      gpu_power:  "$.gpu_power"
      disk_bytes: { v: "$.disk.used_g", max: "$.disk.total_g" }
      net:        { rx: "$.net.rx", tx: "$.net.tx" }

  # ── GPU node 2 ──
  - id: gpu2
    name: "GPU Node 2"
    color: "#b18cff"
    badge: "GPU Node"
    source: { type: demo, interval: "1.5s" }
    map:
      gpu:        "$.gpu"
      vram_pct:   "$.vram.pct"
      cpu:        "$.cpu"
      vram_bytes: { v: "$.vram.used_g", max: "$.vram.total_g" }
      mem_bytes:  { v: "$.mem.used_g",  max: "$.mem.total_g" }
      gpu_temp:   "$.gpu_temp"
      gpu_power:  "$.gpu_power"
      disk_bytes: { v: "$.disk.used_g", max: "$.disk.total_g" }
      net:        { rx: "$.net.rx", tx: "$.net.tx" }

  # ── GPU node 3 ──
  - id: gpu3
    name: "GPU Node 3"
    color: "#ff9d5c"
    badge: "GPU Node"
    source: { type: demo, interval: "1.5s" }
    map:
      gpu:        "$.gpu"
      vram_pct:   "$.vram.pct"
      cpu:        "$.cpu"
      vram_bytes: { v: "$.vram.used_g", max: "$.vram.total_g" }
      mem_bytes:  { v: "$.mem.used_g",  max: "$.mem.total_g" }
      gpu_temp:   "$.gpu_temp"
      gpu_power:  "$.gpu_power"
      disk_bytes: { v: "$.disk.used_g", max: "$.disk.total_g" }
      net:        { rx: "$.net.rx", tx: "$.net.tx" }

  # ── Token accounting (demo synthesizes raw model rows; classify buckets them) ──
  - id: token
    name: "Token Usage"
    color: "#ffcf5a"
    source: { type: demo, interval: "15s" }
    classify:
      by: model
      rules:
        - { name: "Chat / Large", match: { regex: "chat|instruct|large|[0-9]{2,}b" }, color: "#4fe3d0" }
        - { name: "Embedding",    match: { regex: "embed|bge" },                       color: "#8b93a3" }
        - { name: "Vision",       match: { regex: "vl|vision" },                       color: "#b18cff" }
      fallback: { name: "Other", color: "#8b93a3" }
    map:
      token_speed: "$.token_speed"

  # ── Service liveness ──
  - id: svc_api
    name: "API Gateway"
    color: "#5ad19a"
    source: { type: demo, interval: "8s" }
    map:
      latency:  "$.latency_ms"
      procs:    "$.procs"
      sessions: "$.sessions"
      skills:   "$.skills"
      status:   "$.status"

  - id: svc_imagegen
    name: "Image Gen"
    source: { type: demo, interval: "8s" }
    map:
      status:  "$.status"
      latency: "$.latency_ms"

  - id: svc_inference
    name: "Inference"
    source: { type: demo, interval: "8s" }
    map:
      status:  "$.status"
      latency: "$.latency_ms"

  - id: svc_notify
    name: "Notifier"
    source: { type: demo, interval: "8s" }
    map:
      status:  "$.status"
      latency: "$.latency_ms"

  # ── Inference backend (info-style service card) ──
  - id: inference
    name: "Inference Backend · A"
    color: "#b18cff"
    badge: "LLM"
    source: { type: demo, interval: "8s" }
    map:
      status:  "$.status"
      latency: "$.latency_ms"
      model:   "$.model"
      role:    "$.role"

  # second inference backend — demoed as a B12 stack with `inference` above
  - id: inference2
    name: "Inference Backend · B"
    color: "#4fe3d0"
    badge: "LLM"
    source: { type: demo, interval: "8s" }
    map:
      status:  "$.status"
      latency: "$.latency_ms"
      model:   "$.model"
      role:    "$.role"

  # ════════════════════════════════════════════════════════════════════════
  #  REAL-BACKEND EXAMPLES (disabled). Flip enabled:true and point at your own
  #  machines to go live; or just paste one of these `source` forms over a demo
  #  target above (the `map` is identical). These show the real collector shapes.
  # ════════════════════════════════════════════════════════════════════════

  # http: pull a machine's report endpoint — replace with your own backend
  - id: gpu_real_example
    name: "GPU Node (real http)"
    badge: "GPU Node"
    enabled: false
    source: { type: http, url: "http://gpu-node-1.example.local:9100/report", interval: "1.5s" }
    map:
      gpu:        "$.gpu"
      vram_pct:   "$.vram.pct"
      cpu:        "$.cpu"
      vram_bytes: { v: "$.vram.used_g", max: "$.vram.total_g" }
      gpu_temp:   "$.gpu_temp"
      gpu_power:  "$.gpu_power"

  # sql: read-only Postgres token accounting — replace with your own backend
  - id: token_real_example
    name: "Token Usage (real sql)"
    enabled: false
    source:
      type: sql
      driver: postgres
      dsn_env: "PG_DSN"               # ← read-only DB account in .env
      query_file: "queries/token_summary.sql"
      speed_query_file: "queries/token_speed.sql"  # optional: t/s over last N completions
      speed_samples: 10               # whitelisted integer sample count
      total_query_file: "queries/token_total.sql"  # optional: cumulative all-time (cached ~10min)
      interval: "15s"
    classify:
      by: model
      rules:
        - { name: "Chat / Large", match: { regex: "chat|instruct|large|[0-9]{2,}b" }, color: "#4fe3d0" }
        - { name: "Embedding",    match: { regex: "embed|bge" },                       color: "#8b93a3" }
        - { name: "Vision",       match: { regex: "vl|vision" },                       color: "#b18cff" }
      fallback: { name: "Other", color: "#8b93a3" }
    map:
      token_speed: "$.token_speed"

  # sql + `shape: table`: the generic form of the sql collector — run the
  # queries/ file and hand its rows to a type:table card untouched, instead of
  # running them through the by-model token pivot. Same door as every other
  # query (queries/ only, read-only DSN, statement_timeout); the only difference
  # is that nothing interprets the result server-side, so a new table card is a
  # new .sql file + a layout card, with no code change.
  #
  # This one rolls chat tokens up per end user — the OpenAI `user` field the
  # client sends — so a project opts into its own row just by passing
  # user:"<project>". It reads LiteLLM_DailyEndUserSpend, which a read-only role
  # needs its OWN grant for (a grant on LiteLLM_DailyUserSpend does not cover it):
  #   GRANT SELECT ON TABLE "LiteLLM_DailyEndUserSpend" TO <readonly_role>;
  - id: project_tokens_example
    name: "Per-Project Tokens (real sql)"
    enabled: false
    color: "#4fe3d0"
    source:
      type: sql
      driver: postgres
      dsn_env: "PG_DSN"               # ← same read-only DB account as the token card
      query_file: "queries/project_tokens.sql"
      shape: table                    # rows passed through as-is (no pivot)
      interval: "5m"                  # a daily aggregate cannot move faster than this

  # http_push: the machine pushes its own report to the Hub (no inbound access
  # needed). `token_env` names the .env variable holding that target's shared
  # secret (sent as X-Push-Token); `stale_after_s` is how long a silent host stays
  # "online" before the card greys out. Payload shape: docs/AGENT_PROTOCOL.md.
  #
  # B20: NAS with per-disk temperatures. The agent emits extra.disks[] HDD-first
  # then SSD/NVMe, so the indices below are stable groups rather than raw
  # enumeration order — re-check them after adding or pulling a drive. Each
  # `<key>_label` pairs with its `<key>` and supplies the superscript naming the
  # bay the reading came from, so a swap cannot silently mislabel a cell.
  - id: nas_real_example
    name: "NAS (real http_push)"
    color: auto
    badge: "NAS"
    enabled: false
    source:
      type: http_push
      token_env: PUSH_TOKEN_NAS       # ← value lives in .env, one var per push target
      stale_after_s: 15
    map:
      cpu:            "$.cpu.pct"
      uptime:         { s: "$.uptime_s" }
      mem_bytes:      { v: "$.mem.used_gb", max: "$.mem.total_gb" }
      net:            { rx: "$.net.rx_bps", tx: "$.net.tx_bps" }
      nas_disk_bytes: { v: "$.disk.used_gb", max: "$.disk.total_gb" }
      vol1_bytes:     { v: "$.extra.volumes[0].used_gb", max: "$.extra.volumes[0].total_gb" }
      vol2_bytes:     { v: "$.extra.volumes[1].used_gb", max: "$.extra.volumes[1].total_gb" }
      raid:           "$.extra.raid.status"
      disks_hdd:                        # mechanical drives, in bay order
        d1: "$.extra.disks[0].temp_c"
        d1_label: "$.extra.disks[0].label"
        d2: "$.extra.disks[1].temp_c"
        d2_label: "$.extra.disks[1].label"
        d3: "$.extra.disks[2].temp_c"
        d3_label: "$.extra.disks[2].label"
        d4: "$.extra.disks[3].temp_c"
        d4_label: "$.extra.disks[3].label"
      disks_ssd:                        # SATA SSD + M.2 NVMe
        d1: "$.extra.disks[4].temp_c"
        d1_label: "$.extra.disks[4].label"
        d2: "$.extra.disks[5].temp_c"
        d2_label: "$.extra.disks[5].label"

  # B22: LLM gateway. One card = one target, so gateway counters ride in on the
  # host's own push payload under extra.litellm.* (the agent queries the gateway's
  # DB with a read-only account and caches the result) rather than opening a second
  # sql target that could not share the card.
  #
  # B24: the agent-side env that fills these fields (in /etc/homenet-agent.env on the
  # gateway host, NOT this repo's .env):
  #   LITELLM_PG_DSN         read-only DSN; unset disables the whole extra.litellm block
  #   LITELLM_DB_CONTAINER   Postgres container psql runs inside (default: litellm-db)
  #   LITELLM_CONTAINERS     space-separated list of gateway containers whose access
  #                          logs feed reqs_5m; every one of them is summed. Run more
  #                          than one gateway process (e.g. a second port serving a
  #                          different model) and all of them must be listed here or
  #                          reqs_5m silently reports only the instances that are.
  #                          Falls back to the older single-container LITELLM_CONTAINER
  #                          (default: litellm). The DB-backed fields above need no such
  #                          list -- they read one shared table that already holds every
  #                          instance's accounting.
  - id: gateway_litellm_example
    name: "Gateway (real http_push + litellm)"
    color: auto
    enabled: false
    source:
      type: http_push
      token_env: PUSH_TOKEN_GATEWAY
      stale_after_s: 10
    map:
      cpu:        "$.cpu.pct"
      uptime:     { s: "$.uptime_s" }
      mem_bytes:  { v: "$.mem.used_gb",  max: "$.mem.total_gb" }
      disk_bytes: { v: "$.disk.used_gb", max: "$.disk.total_gb" }
      net:        { rx: "$.net.rx_bps",  tx: "$.net.tx_bps" }
      loadavg:    { m1: "$.cpu.load[0]", m5: "$.cpu.load[1]", m15: "$.cpu.load[2]" }
      cache_hit:  "$.extra.litellm.cache_hit_pct"
      success:    "$.extra.litellm.success_pct"
      reqs_today: "$.extra.litellm.reqs_today"
      reqs_5m:    "$.extra.litellm.reqs_5m"
      reqs_by_model:                    # counts + the superscript label for each
        m1:       "$.extra.litellm.by_model.m1"
        m1_label: "$.extra.litellm.by_model.m1_label"
        m2:       "$.extra.litellm.by_model.m2"
        m2_label: "$.extra.litellm.by_model.m2_label"
        m3:       "$.extra.litellm.by_model.m3"
        m3_label: "$.extra.litellm.by_model.m3_label"

  # http: OpenClaw self-reported stats — PHASE-2 contract (authoritative real source).
  #   阶段2 以 OpenClaw 自报为唯一真源,替换 v1 过渡源(:3099/api/dashboard)。
  #   Endpoint:  GET /stats  →  { "procs": <int>, "sessions": <int>, "skills": <int> }
  #     procs    = OpenClaw 自身进程树计数
  #     sessions = 活跃会话数
  #     skills   = ~/.openclaw/skills 一级子目录数
  #   (status/latency 由 http collector 自动附加;卡片 items 里列 procs/sessions/skills 即可)
  - id: openclaw_real_example
    name: "OpenClaw (real http /stats)"
    enabled: false
    source: { type: http, url: "http://openclaw-host.local:PORT/stats", interval: "8s" }
    map:
      procs:    "$.procs"
      sessions: "$.sessions"
      skills:   "$.skills"

  # exec: local allowlisted command (ping). ping_host needs an RFC1918 IP;
  # the docs IPs below are placeholders — replace before enabling.
  - id: ping_router
    name: "Router (ping)"
    source: { type: exec, command: ping_host, args: ["192.0.2.1"], interval: "30s" }
    enabled: false
    map:
      latency: "$.latency_ms"
      status:  "$.status"

  - id: ping_nas
    name: "NAS (ping)"
    source: { type: exec, command: ping_host, args: ["192.0.2.2"], interval: "30s" }
    enabled: false
    map:
      latency: "$.latency_ms"
      status:  "$.status"

  # ── tcp / tls: reachability of one port, and one certificate's expiry (B24) ──
  # These two source types exist mainly for the discovery flow ("+ Add target" in the
  # panel), which writes them into the runtime store rather than into this file. They
  # are equally valid hand-written here, so the shape is documented.
  #
  # Both take `host` + `port` and BOTH are re-validated on every poll: the host must be
  # a private IPv4 address (RFC1918 or loopback), and link-local 169.254.0.0/16 is
  # refused outright. A target aimed anywhere else reports the refusal as its error and
  # never opens a socket — so these cannot be used to reach out of the LAN.

  # tcp: a plain connect probe. A closed or filtered port is a RESULT (status:offline),
  # not a collection failure — that is the whole point of watching a port.
  - id: port_check_example
    name: "Router SSH (:22)"
    source: { type: tcp, host: "192.0.2.1", port: 22, interval: "10s", timeout: "3s" }
    enabled: false
    map:
      status:  "$.status"
      latency: "$.latency_ms"

  # tls: reads the peer certificate and reports days until expiry. Self-signed
  # certificates are accepted on purpose (rejecting them would report nothing at all
  # for most LAN appliances); this measures expiry, it does not establish trust.
  # Render it on a `type: info` card — items there are {label, value} rows:
  #   - { type: info, target: tls_cert_example, title: "NAS cert",
  #       items: [ { label: "Expires in", value: "{expiry_days} days" } ] }
  - id: tls_cert_example
    name: "NAS certificate (:5001)"
    source: { type: tls, host: "192.0.2.2", port: 5001, interval: "60m", timeout: "4s" }
    enabled: false
    map:
      expiry_days: "$.expiry_days"
