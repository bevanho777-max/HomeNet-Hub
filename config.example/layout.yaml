# layout.yaml — presentation (§4.3)  ·  NEUTRAL EXAMPLE
# Pure view config: which target renders as which card type, which metrics go on
# rings vs. the key/value grid, and the header/status-bar/history wiring. Column
# width & wrapping come from the CSS grid (auto-fit), not from here.
#
# All display text is config-driven (§12-step2). "HomeNet Hub" is the product
# name; everything else here is neutral and meant to be edited. Free-text fields
# accept any language (write your own localized strings).
#
# ── i18n: the `_en` convention ──────────────────────────────────────────────
# The header carries a 中 / EN switch. It is a per-viewer browser preference — stored in
# localStorage, never sent to the server, and it never changes what anyone else sees. It
# swaps two things: the frontend's own chrome (buttons, panels, confirmations), which is
# built in; and the display text in THIS file, which is up to you.
#
# Any display-text field may carry an `_en` sibling:
#
#   scalars     title_en / hint_en / detail_title_en / empty_note_en / more_label_en,
#               plus name_en / badge_en in targets.yaml, label_en in metrics.yaml and
#               subtitle_en in theme.yaml
#   label maps  a parallel map with the same keys: text_en / labels_en / columns_en /
#               detail_columns_en. An entry there may be a bare string (the label alone,
#               keeping the base entry's `format`) or an object merged over the base one.
#   inline      a `columns` / `detail_columns` entry written in object form can carry
#               `label_en` next to its `format` instead of using the parallel map — the
#               better choice when only one column needs translating.
#
# Nothing is required. A field with no variant renders its base value in BOTH languages,
# so a half-translated file reads as mixed text rather than going blank. Only PROSE takes
# a variant: metric keys, target ids, colours, units and formats are references, and two
# spellings of a reference is how a config quietly stops matching itself.
#
# This file is already written in English, so the `_en` values below mirror their base
# values. They are here to show the shape — delete them, or translate the base fields
# into your own language and let `_en` carry the English.

header:
  title: "HomeNet Hub"              # product name — change to your own if you like
  clock: true                       # live clock, top-right

# Global UI chrome labels (i18n-ready). Generic fallbacks live in the frontend;
# these override them. Omit a key to fall back to the built-in text.
text:
  raw_title: "Raw JSON (debug)"
  modal_close: "Close"
  conn_connecting: "Connecting…"
  conn_online: "Online"
  conn_reconnecting: "Reconnecting…"   # B15: shown after a few consecutive poll failures
  conn_offline: "Disconnected"
  conn_locked: "Login required"      # admin-auth: REQUIRE_LOGIN_TO_VIEW is on and this tab has no session

# The EN half of `text`, overlaid key by key. A key missing here falls back to `text`;
# a key in neither falls back to the frontend's own built-in string (already English).
# Write your own language into `text` above and leave this block as the English.
text_en:
  raw_title: "Raw JSON (debug)"
  modal_close: "Close"
  conn_connecting: "Connecting…"
  conn_online: "Online"
  conn_reconnecting: "Reconnecting…"
  conn_offline: "Disconnected"
  conn_locked: "Login required"

status_bar:                         # top service pill row
  targets: [svc_api, svc_imagegen, svc_inference, svc_notify]

grid:
  # row 1 — four machine cards
  - target: gateway
    type: machine
    # B23: click a machine card -> that host's multi-metric history modal (24h/7d/30d).
    # Same values the rings show, plotted over time; omit the key to keep the card inert.
    # Lines are picked per role from what /api/history actually has, so a host without
    # GPU quietly falls back to cpu/mem/disk instead of drawing empty axes.
    clickable: detail
    rings: [cpu, mem_pct, disk_pct]
    items: [mem_bytes, disk_bytes, loadavg, net]
    header_right: uptime

  - target: gpu1
    type: machine
    clickable: detail
    rings: [gpu, vram_pct, cpu]
    items: [vram_bytes, mem_bytes, gpu_temp, gpu_power, disk_bytes, net]
    header_right: [badge, uptime]     # B13: combined "GPU Node │ 15d Xh"

  - target: gpu2
    type: machine
    clickable: detail
    rings: [gpu, vram_pct, cpu]
    items: [vram_bytes, mem_bytes, gpu_temp, gpu_power, disk_bytes, net]

  - target: gpu3
    type: machine
    clickable: detail
    rings: [gpu, vram_pct, cpu]
    items: [vram_bytes, mem_bytes, gpu_temp, gpu_power, disk_bytes, net]

  # row 2 — token / api / inference
  - target: token
    type: token
    clickable: detail               # click → /api/token_detail modal
    front_max: 3                    # §12-step6: max class boxes on card front (modal shows all)
    header_right: "LiteLLM · {token_speed} t/s"
    hint: "Click the card for per-model detail"
    hint_en: "Click the card for per-model detail"
    detail_title: "Token Detail · by Model"
    detail_title_en: "Token Detail · by Model"
    columns:
      model: "Model"
      tokens: "Tokens"
      # Actually-new tokens: prompt minus the KV-cached prefix, plus completion — what
      # the backend really had to process. The bracketed percentage is that as a share
      # of the class's own total; a low one means the class is mostly replayed context.
      # Shown only when the queries/ files supply a net_tokens column (this file's
      # neutral examples do not — see queries/token_summary.sql).
      net: "Net"
      requests: "Requests"
      share: "Share"
    # The EN half of `columns`, same keys. A bare string replaces just the label; an
    # object is merged over the base entry (so it can also change `format`).
    columns_en:
      model: "Model"
      tokens: "Tokens"
      net: "Net"
      requests: "Requests"
      share: "Share"
    labels:                              # §12-step2 patch: token card front labels
      today: "Today"                     # stat-box "today" prefix
      net: "Net"                         # stat-box "actually-new" prefix (today only;
                                         # the all-time figure lives in the modal table)
      requests_suffix: "req"             # stat-box request-count suffix
      total: "Total"                     # the total/aggregate column label
    labels_en:                           # the EN half, same keys
      today: "Today"
      net: "Net"
      requests_suffix: "req"
      total: "Total"

  - target: svc_api
    type: service
    header_right: status
    items: [procs, sessions, skills, latency]

  # B12: stack — two service backends in one frame (falls back to single `type:
  # service` with a `target:`); each child keeps its own name/badge/identity color.
  - type: stack
    # direction: row               # optional: side-by-side (default column); narrow container (<480px) auto-wraps to column
    children: [inference, inference2]
    header_right: badge
    items: [status, latency, model, role]

  # B20/B22 card shapes for the two real-backend examples in targets.yaml (both
  # ship disabled there, so these stay commented — uncomment both sides together).
  #
  # NAS: one cell per disk group; each disk is coloured on its own by
  # `part_thresholds`, and `sample_parts: max` in metrics.yaml puts the hottest
  # drive of each group into the timeseries as disks_hdd_max / disks_ssd_max.
  # - target: nas_real_example
  #   type: machine
  #   clickable: detail
  #   rings: [cpu, mem_bytes, vol1_bytes]
  #   items: [disks_hdd, disks_ssd, mem_bytes, nas_disk_bytes, raid, net]
  #   header_right: [badge, uptime]
  #
  # LLM gateway: hit/success rates are higher_is_better rings, request counts are
  # plain cells (reqs_by_model borrows the parts renderer for its superscripts).
  # The rings and the two request cells are chat-only; reqs_by_model stays all-model
  # so embedding traffic remains visible, which is why its slots do not sum to the
  # Chat Requests cell. reqs_5m_embed is collected but deliberately left out of items.
  # - target: gateway_litellm_example
  #   type: machine
  #   clickable: detail
  #   rings: [cpu, cache_hit, success]
  #   items: [mem_bytes, disk_bytes, reqs_today, reqs_5m, reqs_by_model, net]
  #   header_right: uptime

  # Generic table card — one row per row the target's query returned, no pivot.
  # `columns` is an ordered map of row-key → "Label", or → { label, format }
  # where format is compact (1.2M) / number (1,234,567) / text; omitted, the
  # renderer infers it from the value. Pairs with a `shape: table` sql target
  # (see project_tokens_example in targets.yaml). Commented out because this file
  # ships in demo mode and that target is disabled — uncomment both together.
  #
  # - target: project_tokens_example
  #   type: table
  #   title: "Per-Project Tokens · chat only"
  #   columns:
  #     project:        "Project"
  #     tokens_total:   { label: "Tokens", format: compact }
  #     # Actually-new tokens: prompt minus the KV-cached prefix, plus completion.
  #     # Requires the net_total column from queries/project_tokens.sql.
  #     #
  #     # FOUR figure columns is what a 300px-min card holds. The table is
  #     # table-layout:fixed with the identity column pinned at 36%, so a fifth column
  #     # shrinks every figure to ~16% and an 8-character token count truncates under
  #     # the ellipsis — measured, not guessed. For the same reason the net is its own
  #     # column rather than "616M (21%)" inside the Tokens cell: the combined value is
  #     # wider than either number alone and truncates sooner. Compare across the row.
  #     # tokens_7d / tokens_30d are still returned by the query — swap one in here if
  #     # recency matters more to you than request counts.
  #     net_total:      { label: "Net",    label_en: "Net", format: compact }
  #     requests_total: { label: "Reqs",   format: number }
  #   # Rows kept on the card front. Over this many and the card becomes clickable, grows
  #   # a "查看全部（共 N）" line, and opens a modal with every row and every column.
  #   # At or under it the card stays inert, like any other card with nothing more to show.
  #   # Default is 6 — what fits at the default card height.
  #   front_max: 4
  #   # The modal's columns. The front is width-limited to four; the windows and dates the
  #   # query already returns go here. Declaring this also switches the modal off its
  #   # derive-from-the-rows fallback, which is the safer mode: that fallback has to guess,
  #   # and it guesses with a denylist (see web/renderers/table_detail.js).
  #   detail_columns:
  #     project:        "Project"
  #     tokens_total:   { label: "Tokens", format: compact }
  #     net_total:      { label: "Net",    label_en: "Net", format: compact }
  #     requests_total: { label: "Reqs",   format: number }
  #     tokens_7d:      { label: "7d",     format: compact }
  #     tokens_30d:     { label: "30d",    format: compact }
  #     first_day:      { label: "First",  format: text }
  #     last_day:       { label: "Last",   format: text }
  #   empty_note: "No chat traffic recorded yet."
  #   empty_note_en: "No chat traffic recorded yet."
  #   hint: "One row per API key. Chat models only — embedding/rerank excluded."
  #   hint_en: "One row per API key. Chat models only — embedding/rerank excluded."
  #   # The words before the "(N total)" count on the overflow line. Omitted, the
  #   # frontend supplies its own, already translated.
  #   more_label: "View all"
  #   more_label_en: "View all"

  # §12-step4: generic info card — pure label/value list, no target needed.
  # Add any "info box" by adding a type:info card here; no code changes.
  - type: info
    title: "About"
    title_en: "About"
    # An info row's `value` is a literal sentence as often as it is a number, so both
    # halves take a variant — unlike a metric key elsewhere, which is a reference.
    items:
      - { label: "Version", value: "v2.0.0" }
      - { label: "Mode", label_en: "Mode", value: "Demo (synthetic data)", value_en: "Demo (synthetic data)" }
      - { label: "Nodes", value: "3 GPU + gateway" }
      - { label: "Source", value: "config-driven YAML" }

history:                            # bottom — dual-pane compare
  type: compare                     # B10: N-pane compare (dual_compare still accepted)
  title: "History · Compare"
  title_en: "History · Compare"
  ranges: ["1h", "6h", "24h"]
  default_range: "6h"
  selectable_targets: [gpu1, gpu2, gpu3, gateway]
  panes: [gpu1, gpu2, gpu3]         # B10: N panes (falls back to `default: [a,b]` if omitted)
