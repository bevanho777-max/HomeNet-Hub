<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/tokens.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span><h1 id="title"></h1></div>
    <div class="meta">
      <span id="conn" class="conn"></span>
      <!-- 双时区时钟:id 留在外层容器上,header.clock 显隐开关逻辑不变。
           每行结构固定,tickClock 只改 .tztime 的文本与 .tzrow 的昼夜 class。
           图标用单色文本符号(非 emoji),这样冷暖色才受 CSS 控制。 -->
      <div id="clock" class="clock">
        <span class="tzrow" data-z="CN"><i class="tzicon">☀︎</i><b class="tzname">CN</b><span class="tztime">—</span></span>
        <span class="tzrow" data-z="US"><i class="tzicon">☾</i><b class="tzname">US</b><span class="tztime">—</span></span>
      </div>
    </div>
  </header>

  <!-- service pill row (status_bar.targets) -->
  <section id="services" class="chips"></section>

  <!-- machine / token / service cards (layout.grid) -->
  <main id="grid" class="grid"></main>

  <!-- history dual-compare (layout.history) -->
  <section class="history" id="history" hidden>
    <div class="hist-head">
      <h2 id="historyTitle"></h2>
      <div class="ranges" id="rangeBtns"></div>
    </div>
    <!-- B10: N panes generated by history.js from layout.history.panes (or default) -->
    <div class="hist-split" id="histSplit"></div>
  </section>

  <details class="raw">
    <summary id="rawTitle"></summary>
    <pre id="rawjson">—</pre>
  </details>

  <!-- token detail modal -->
  <div class="modal-mask" id="tokenModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="tokenModalTitle"></h2>
        <button class="modal-close" id="tokenModalClose"></button>
      </div>
      <div class="ranges" id="tokenModalRanges"></div>
      <canvas id="tokenModalCanvas" height="220" style="width:100%;display:block;margin-top:16px"></canvas>
      <div id="tokenModalTable"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
