<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/tokens.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span><h1 id="title"></h1></div>
    <div class="meta">
      <!-- 切片3:添加目标入口。放在连接角标之前,与时钟同处 header 右侧。 -->
      <!-- admin-auth: 管理控件默认隐藏,由 /api/session 的结果揭示 —— 默认隐藏而不是
           默认显示再隐藏,页面就不会先闪一下未登录时点不动的按钮。 -->
      <button type="button" id="addOpen" class="addOpen" hidden>＋ 添加目标</button>
      <button type="button" id="credOpen" class="addOpen" hidden>凭据</button>
      <button type="button" id="loginOpen" class="addOpen" hidden>管理登录</button>
      <button type="button" id="passwdOpen" class="addOpen" hidden>改密</button>
      <button type="button" id="logoutBtn" class="addOpen" hidden>登出</button>
      <span id="conn" class="conn"></span>
      <!-- 双时区时钟:id 留在外层容器上,header.clock 显隐开关逻辑不变。
           每行结构固定,tickClock 只改 .tztime 的文本与 .tzrow 的昼夜 class。
           太阳用单色文本符号,月亮用内联 SVG(两圆布尔差挖出饱满月牙,缺口朝左上,
           fill=currentColor 跟随行的冷暖色)。两个图标常驻 DOM,靠 day/night
           class 切换显隐 —— 昼夜翻转时 JS 只改 class,不写图标内容。 -->
      <div id="clock" class="clock">
        <span class="tzrow" data-z="CN"><i class="tzicon"><span class="ic-sun">☀︎</span><svg class="ic-moon" viewBox="0 0 16 16" aria-hidden="true"><mask id="moon-cn"><circle cx="8" cy="8" r="7" fill="#fff"/><circle cx="4" cy="6" r="6.2" fill="#000"/></mask><circle cx="8" cy="8" r="7" fill="currentColor" mask="url(#moon-cn)"/></svg></i><b class="tzname">CN</b><span class="tztime">—</span></span>
        <span class="tzrow" data-z="US"><i class="tzicon"><span class="ic-sun">☀︎</span><svg class="ic-moon" viewBox="0 0 16 16" aria-hidden="true"><mask id="moon-us"><circle cx="8" cy="8" r="7" fill="#fff"/><circle cx="4" cy="6" r="6.2" fill="#000"/></mask><circle cx="8" cy="8" r="7" fill="currentColor" mask="url(#moon-us)"/></svg></i><b class="tzname">US</b><span class="tztime">—</span></span>
      </div>
    </div>
  </header>

  <!-- service pill row (status_bar.targets) -->
  <section id="services" class="chips"></section>

  <!-- machine / token / service cards (layout.grid) -->
  <main id="grid" class="grid"></main>

  <!-- history dual-compare (layout.history) -->
  <section class="history" id="history" hidden>
    <div class="hist-head">
      <h2 id="historyTitle"></h2>
      <div class="ranges" id="rangeBtns"></div>
    </div>
    <!-- B10: N panes generated by history.js from layout.history.panes (or default) -->
    <div class="hist-split" id="histSplit"></div>
  </section>

  <details class="raw">
    <summary id="rawTitle"></summary>
    <pre id="rawjson">—</pre>
  </details>

  <!-- admin login (admin-auth): same modal shell. The field is type=password, is never
       populated from a response, and is cleared on every submit outcome. -->
  <!-- 首次运行:服务端还没有管理员密码,而且请求来自局域网。这个框只在那一刻存在 ——
       一旦设过密码,后端一律 409,前端也不会再拿到 setup_available。两个框都是
       password 类型,任何一条路径出去都清空,和登录/改密同一条规矩。 -->
  <div class="modal-mask" id="setupModal">
    <div class="modal addModal">
      <div class="modal-head">
        <h2>设置管理员密码</h2>
        <button class="modal-close" id="setupClose">关闭</button>
      </div>
      <div class="addBar">
        <input id="setupPass" class="addInput" type="password" autocomplete="new-password"
               placeholder="管理密码(至少 8 位)" />
      </div>
      <div class="addBar">
        <input id="setupConfirm" class="addInput" type="password" autocomplete="new-password"
               placeholder="再输一次" />
        <button type="button" id="setupSubmit" class="addBtn primary">设置</button>
      </div>
      <div id="setupStatus" class="addStatus"></div>
    </div>
  </div>

  <div class="modal-mask" id="loginModal">
    <div class="modal addModal">
      <div class="modal-head">
        <h2>管理登录</h2>
        <button class="modal-close" id="loginClose">关闭</button>
      </div>
      <div class="addBar">
        <input id="loginPass" class="addInput" type="password" autocomplete="current-password"
               placeholder="管理密码" />
        <button type="button" id="loginSubmit" class="addBtn primary">登录</button>
      </div>
      <div id="loginStatus" class="addStatus"></div>
    </div>
  </div>

  <!-- 修改管理密码。三个框都是 password 类型,任何一条路径出去都清空:把用户刚打的字
       留在 DOM 里,和把它显示出来只差一次"检查元素"。 -->
  <div class="modal-mask" id="passwdModal">
    <div class="modal addModal">
      <div class="modal-head">
        <h2>修改管理密码</h2>
        <button class="modal-close" id="passwdClose">关闭</button>
      </div>
      <div class="credGrid">
        <label>当前密码<input id="passwdCurrent" class="addInput" type="password"
               autocomplete="current-password" /></label>
        <label>新密码<input id="passwdNew" class="addInput" type="password"
               autocomplete="new-password" placeholder="至少 8 个字符" /></label>
        <label>确认新密码<input id="passwdConfirm" class="addInput" type="password"
               autocomplete="new-password" /></label>
      </div>
      <div class="addFoot"><button type="button" id="passwdSubmit" class="addBtn primary">修改密码</button></div>
      <div id="passwdStatus" class="addStatus"></div>
      <div class="addMuted">改密后,除当前这个标签页之外的所有已登录会话都会立即失效。</div>
    </div>
  </div>

  <!-- credentials panel (slice 2e): same modal shell; secret is write-only -->
  <div class="modal-mask" id="credModal">
    <div class="modal addModal">
      <div class="modal-head">
        <h2>凭据</h2>
        <button class="modal-close" id="credClose">关闭</button>
      </div>
      <div id="credLocked" class="credLocked" hidden>
        <b>未配置 VAULT_KEY</b>
        <span class="addMuted">金库锁定,无法存取凭据(<span id="credLockedWhy"></span>)。</span>
        <span class="addMuted">在宿主机的 compose 环境里设置 VAULT_KEY 后重启容器即可。</span>
      </div>
      <div id="credForm">
        <div class="credGrid">
          <label>名称<input id="credName" class="addInput" type="text" maxlength="60" placeholder="nas-root" autocomplete="off" /></label>
          <label>类型<select id="credType" class="addInput credSelect">
            <option value="ssh_password">SSH 密码</option>
            <option value="ssh_key">SSH 私钥</option>
            <option value="winrm_password">WinRM 密码</option>
          </select></label>
          <label>用户名<input id="credUser" class="addInput" type="text" maxlength="60" placeholder="root" autocomplete="off" /></label>
          <label>密钥 / 密码<input id="credSecret" class="addInput" type="password" autocomplete="new-password" placeholder="存入后不可读出" /></label>
        </div>
        <div class="addFoot"><button type="button" id="credSave" class="addBtn primary">加密保存</button></div>
      </div>
      <div id="credStatus" class="addStatus"></div>
      <div class="addSection">已存凭据</div>
      <div id="credList"></div>
    </div>
  </div>

  <!-- 版本号页脚(切片 version):内容由 /api/config 的 version 字段填,未取到则整个
       页脚留空、不占视觉位置。 -->
  <footer class="foot"><span id="version"></span></footer>

  <!-- token detail modal -->
  <div class="modal-mask" id="tokenModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="tokenModalTitle"></h2>
        <button class="modal-close" id="tokenModalClose"></button>
      </div>
      <div class="ranges" id="tokenModalRanges"></div>
      <canvas id="tokenModalCanvas" height="220" style="width:100%;display:block;margin-top:16px"></canvas>
      <div id="tokenModalTable"></div>
    </div>
  </div>

  <!-- machine detail modal (§6): same shell as the token modal, History's chart inside -->
  <div class="modal-mask" id="machineModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="machineModalTitle"></h2>
        <button class="modal-close" id="machineModalClose"></button>
      </div>
      <div class="ranges" id="machineModalRanges"></div>
      <div class="histWrap" style="margin-top:16px">
        <canvas id="machineModalCanvas" height="300" style="width:100%;display:block"></canvas>
        <div class="histErr" id="machineModalErr" hidden></div>
      </div>
      <div class="legend" id="machineModalLegend" style="margin-top:12px"></div>
      <div class="note" id="machineModalNote" hidden></div>
    </div>
  </div>

  <!-- add-target panel (slice 3): reuses the modal shell the token/machine modals use -->
  <div class="modal-mask" id="addModal">
    <div class="modal addModal">
      <div class="modal-head">
        <h2>添加目标</h2>
        <button class="modal-close" id="addClose">关闭</button>
      </div>
      <div class="addBar">
        <input id="addHost" class="addInput" type="text" inputmode="numeric" autocomplete="off"
               placeholder="192.168.1.x（仅限私网地址）" maxlength="15" />
        <button type="button" id="addDiscover" class="addBtn primary">发现</button>
      </div>
      <div id="addStatus" class="addStatus"></div>
      <div id="addManifest"></div>
      <div id="addFoot" class="addFoot" hidden>
        <button type="button" id="addSelected" class="addBtn primary" disabled>添加所选</button>
      </div>
      <div class="addSection">已添加</div>
      <div id="addList"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
